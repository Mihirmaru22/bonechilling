name: Build Windows App

on:
  push:
    branches: [ main, master, industrial-rebuild ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:            # reused by release.yml
    inputs:
      version:
        description: "Version stamped into the installer (e.g. 0.2.1)"
        type: string
        required: false
        default: ""

jobs:
  build:
    name: Build BoneChilling (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --group dev   # test-only deps (httpx2 for starlette.testclient)
          pip install pyinstaller

      - name: Run tests
        run: |
          # eval/ is skipped here (real PHI); run the unit/integration suite
          $fail = 0
          Get-ChildItem tests/test_*.py | ForEach-Object {
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          if ($fail -ne 0) { exit 1 }
        shell: pwsh

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm BoneChilling.spec

      - name: Compile installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ("${{ inputs.version }}") { & $iscc "/DAppVersion=${{ inputs.version }}" packaging\installer.iss }
          else { & $iscc packaging\installer.iss }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: BoneChilling-Windows-x64
          path: dist/BoneChilling
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BoneChilling-Setup
          path: packaging/Output/*.exe
          if-no-files-found: error
