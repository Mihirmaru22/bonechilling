name: Build Windows App

on:
  push:
    branches: [ main, master, industrial-rebuild ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build BoneChilling (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Run tests
        run: |
          # eval/ is skipped here (real PHI); run the unit/integration suite
          $fail = 0
          Get-ChildItem tests/test_*.py | ForEach-Object {
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          if ($fail -ne 0) { exit 1 }
        shell: pwsh

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm BoneChilling.spec

      - name: Compile installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
        shell: pwsh
        continue-on-error: true   # Inno Setup is preinstalled on windows-latest; don't hard-fail the folder build

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: BoneChilling-Windows-x64
          path: dist/BoneChilling
          if-no-files-found: error

      - name: Upload installer (if built)
        uses: actions/upload-artifact@v4
        with:
          name: BoneChilling-Setup
          path: packaging/Output/*.exe
          if-no-files-found: ignore
