name: Check model catalog

# Monthly check that every curated model still exists (Ollama registry,
# OpenRouter, and Anthropic/OpenAI/Gemini when their key secrets are set).
# A failure emails the repo owner: update src/bonechiling/engines/models.json.
on:
  schedule:
    - cron: "17 6 1 * *"      # 06:17 UTC on the 1st of every month
  workflow_dispatch:
  push:
    paths:
      - "src/bonechiling/engines/models.json"
      - "scripts/check_models.py"
      - ".github/workflows/check-models.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/check_models.py
