name: Release

# Push a tag like v0.2.1 to publish a GitHub Release with the Windows
# installer and a portable zip. The tag must match __version__ in
# src/bonechiling/__init__.py (and pyproject.toml), so the app, installer
# and release page always agree.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/bonechiling/__init__.py').read()).group(1))")
          proj=$(python3 -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "tag=$tag app=$app pyproject=$proj"
          if [ "$tag" != "$app" ] || [ "$tag" != "$proj" ]; then
            echo "::error::Tag v$tag doesn't match __version__ ($app) / pyproject ($proj). Bump the version, commit, then tag."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.check-version.outputs.version }}

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package files
        run: |
          v="${{ needs.check-version.outputs.version }}"
          mkdir out
          cp artifacts/BoneChilling-Setup/*.exe "out/BoneChilling-Setup-$v.exe"
          (cd artifacts/BoneChilling-Windows-x64 && zip -qr "../../out/BoneChilling-$v-portable-win64.zip" .)
          (cd out && sha256sum * > SHA256SUMS.txt)
          sed "s/{{VERSION}}/$v/g" .github/release-notes.md > notes.md
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          name: BoneChilling ${{ needs.check-version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: out/*
