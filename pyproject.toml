[project]
name = "bonechiling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ollama>=0.6.2",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=11.3.0",
    "pydicom>=2.4.4",
    "pyside6>=6.10.3",
    "pytesseract>=0.3.13",
    "requests>=2.32.5",
]

[project.scripts]
bonechiling = "bonechiling:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]

