<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoneChilling — Orthopedic X-ray Reader</title>
  <link rel="preload" href="fonts/host-grotesk-400_700-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M17 3a3 3 0 0 0-2.9 3.8L6.8 14.1A3 3 0 1 0 9.9 17.2l7.3-7.3A3 3 0 1 0 17 3Z"/></svg>
        </div>
        <div>
          <div class="brand-name">BoneChilling</div>
          <div class="brand-sub">Orthopedic X-ray reader</div>
        </div>
      </div>

      <nav id="nav" aria-label="Main">
        <div class="nav-group">Workflow</div>
        <button data-view="worklist" class="active">
          <span class="idx">01</span>
          <span class="nav-text"><b>Worklist</b><small>Patients &amp; review status</small></span>
        </button>
        <button data-view="ingest">
          <span class="idx">02</span>
          <span class="nav-text"><b>Ingest</b><small>Analyze new X-ray folders</small></span>
        </button>
        <div class="nav-group">Configuration</div>
        <button data-view="settings">
          <span class="idx">03</span>
          <span class="nav-text"><b>Settings</b><small>AI engine &amp; local model</small></span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div id="conn" class="conn"><span class="dot"></span><span class="conn-text">Connecting…</span></div>
        <p class="disclaimer">
          Assistive tool. It reports objective facts only; every finding must be verified by a qualified physician.
        </p>
      </div>
    </aside>

    <main id="app" tabindex="-1"><div class="loading">Loading…</div></main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
